name: Desktop CI and GitHub Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'rc*'
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go, Python, and Electron tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Check Go packages
        run: go test ./...

      - name: Check Go race behavior
        run: go test -race ./...

      - name: Check Python packaging tests
        run: python -m unittest discover -s packaging -p 'test_*.py'

      - name: Install locked Node dependencies
        run: npm ci

      - name: Check Electron desktop tests
        run: npm test

  release_version:
    name: Verify source version and release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify source version fields or release tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node desktop/scripts/release-version.cjs check-tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
          else
            node desktop/scripts/release-version.cjs check-source --github-output "$GITHUB_OUTPUT"
          fi

  native-build:
    name: Build ${{ matrix.target }} on its native runner
    needs: [checks, release_version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            artifact: DJI-LUT-macOS-AppleSilicon.zip
          - target: darwin-amd64
            runner: macos-15-intel
            artifact: DJI-LUT-macOS-Intel.zip
          - target: windows-amd64
            runner: windows-2025
            artifact: DJI-LUT-Windows-x64.zip
    env:
      PYTHON: python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Run Go tests on the native target
        run: go test ./...

      - name: Install locked Node dependencies
        run: npm ci

      - name: Run Electron desktop tests on the native target
        run: npm test

      - name: Prepare verified DJI LUT payloads
        run: python packaging/prepare_luts.py

      - name: Prepare this target's hash-locked FFmpeg runtime
        run: python packaging/prepare_runtime.py "${{ matrix.target }}"

      - name: Build native desktop package
        run: npm run build:desktop -- "${{ matrix.target }}"

      - name: Smoke-test the package, bundled catalog, payloads, runtimes, and licenses
        run: >-
          python desktop/scripts/verify_desktop_build.py
          --target "${{ matrix.target }}"
          --archive "dist/electron/${{ matrix.artifact }}"
          --version "${{ needs.release_version.outputs.version }}"
          --tag "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          --commit "${{ github.sha }}"
          --metadata "dist/electron/build-metadata-${{ matrix.target }}.json"

      - name: Upload native package for the release job
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist/electron/${{ matrix.artifact }}
            dist/electron/build-metadata-${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload verified preview package
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ matrix.target }}
          path: |
            dist/electron/${{ matrix.artifact }}
            dist/electron/build-metadata-${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-release:
    name: Create verified GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, release_version, native-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all three verified native builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: release-input

      - name: Validate assets and create release checksums
        run: >-
          python desktop/scripts/collect_release_artifacts.py
          --input release-input
          --output release-output
          --tag "$GITHUB_REF_NAME"
          --version "${{ needs.release_version.outputs.version }}"
          --commit "$GITHUB_SHA"

      - name: Create or resume a draft, verify every uploaded asset, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release_version.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.release_version.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="DJI LUT $RELEASE_VERSION"
          create_args=(--draft --verify-tag --title "$title" --generate-notes)
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            create_args+=(--prerelease)
          fi

          if ! gh release create "$tag" "${create_args[@]}"; then
            existing_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)" || {
              echo "Could not verify an existing draft release; refusing to publish."
              exit 1
            }
            if [[ "$existing_draft" != "true" ]]; then
              echo "A published release already exists for this tag; refusing to overwrite it."
              exit 1
            fi
          fi

          existing_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          if [[ "$existing_draft" != "true" ]]; then
            echo "Release is no longer a draft; refusing to replace published assets."
            exit 1
          fi
          gh release upload "$tag" release-output/*.zip release-output/BUILD-METADATA.json release-output/SHA256SUMS --clobber

          expected_assets="$(printf '%s\n' \
            DJI-LUT-macOS-AppleSilicon.zip \
            DJI-LUT-macOS-Intel.zip \
            DJI-LUT-Windows-x64.zip \
            BUILD-METADATA.json \
            SHA256SUMS | sort)"
          actual_assets="$(gh release view "$tag" --json assets --jq '[.assets[].name] | sort | join("\n")')"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Draft release asset names do not match the verified native build set; refusing to publish."
            exit 1
          fi

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$tag" --dir "$verify_dir"
          cmp -- release-output/SHA256SUMS "$verify_dir/SHA256SUMS"
          (cd "$verify_dir" && sha256sum --check "$GITHUB_WORKSPACE/release-output/SHA256SUMS")

          release_id="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --field draft=false \
            --field prerelease="$RELEASE_PRERELEASE" \
            --field name="$title"
